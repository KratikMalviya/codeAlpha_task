<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login · Vibe</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">⚡ Vibe</div>
    <p class="auth-sub">Sign in to your account</p>
    <form id="loginForm">
      <div class="form-group">
        <label>Email or Username</label>
        <input type="text" id="login" placeholder="you@example.com or @username" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="auth-submit" id="submitBtn">Sign In</button>
    </form>
    <p class="auth-switch">No account? <a href="/register.html">Create one</a></p>
  </div>
</div>
<script src="/js/app.js"></script>
<script>
  if (getToken()) location.href = '/';
  document.getElementById('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true; btn.textContent = 'Signing in…';
    try {
      const { token, user } = await apiFetch('/api/auth/login', {
        method: 'POST',
        body: JSON.stringify({ login: document.getElementById('login').value.trim(), password: document.getElementById('password').value })
      });
      setSession(token, user);
      location.href = '/';
    } catch(e) {
      toast(e.message, 'error');
      btn.disabled = false; btn.textContent = 'Sign In';
    }
  });
</script>
</body>
</html>
