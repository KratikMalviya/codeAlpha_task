<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register · Vibe</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">⚡ Vibe</div>
    <p class="auth-sub">Join the conversation</p>
    <form id="registerForm">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="name" placeholder="John Doe" required minlength="2">
      </div>
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" placeholder="john_doe" required minlength="3" maxlength="20">
        <small style="color:var(--text2);font-size:.78rem;">Letters, numbers and underscore only</small>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Min 6 characters" required minlength="6">
      </div>
      <button type="submit" class="auth-submit" id="submitBtn">Create Account</button>
    </form>
    <p class="auth-switch">Already have an account? <a href="/login.html">Sign in</a></p>
  </div>
</div>
<script src="/js/app.js"></script>
<script>
  if (getToken()) location.href = '/';
  document.getElementById('registerForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true; btn.textContent = 'Creating…';
    try {
      const { token, user } = await apiFetch('/api/auth/register', {
        method: 'POST',
        body: JSON.stringify({
          name:     document.getElementById('name').value.trim(),
          username: document.getElementById('username').value.trim(),
          email:    document.getElementById('email').value.trim(),
          password: document.getElementById('password').value,
        })
      });
      setSession(token, user);
      location.href = '/';
    } catch(e) {
      toast(e.message, 'error');
      btn.disabled = false; btn.textContent = 'Create Account';
    }
  });
</script>
</body>
</html>
